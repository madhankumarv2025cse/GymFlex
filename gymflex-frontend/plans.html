<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlex - Membership Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading d-flex align-items-center">
                <img src="assets/logo.svg" alt="GymFlex Logo" style="height: 32px; filter: brightness(0) invert(1);" class="me-2">
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="members.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-2"></i>Members
                </a>
                <a href="plans.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-journal-bookmark me-2"></i>Plans
                </a>
                <a href="memberships.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-card-heading me-2"></i>Memberships
                </a>
                <a href="attendance.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-calendar-check me-2"></i>Attendance
                </a>
            </div>
            <div class="px-3 mt-auto mb-4">
                <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <div class="container-fluid p-0">
                    <span class="navbar-brand fw-bold text-dark">Membership Plans</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <div>
                        <h4 class="fw-bold mb-1">Membership Plans</h4>
                        <p class="text-muted mb-0">Configure pricing and subscription packages for members</p>
                    </div>
                    <button class="btn btn-primary shadow-sm" onclick="openAddPlanModal()" style="background-color: var(--primary-color); border: none;">
                        <i class="bi bi-plus-circle me-2"></i>Add New Plan
                    </button>
                </div>

                <!-- Plans Cards Grid -->
                <div class="row g-4" id="plans-container">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Plan Modal -->
    <div class="modal fade" id="planModal" tabindex="-1" aria-labelledby="planModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="planModalTitle">Add New Membership Plan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="plan-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="plan-id">

                        <div class="mb-3">
                            <label for="planName" class="form-label fw-semibold">Plan Name</label>
                            <input type="text" class="form-control" id="planName" required placeholder="e.g. MONTHLY, QUARTERLY, YEARLY">
                        </div>

                        <div class="mb-3">
                            <label for="durationInMonths" class="form-label fw-semibold">Duration (in Months)</label>
                            <input type="number" class="form-control" id="durationInMonths" min="1" required placeholder="1">
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label fw-semibold">Price (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="price" min="1" required placeholder="1000">
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-plan-btn" style="background-color: var(--primary-color); border: none;">Save Plan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deletePlanModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-exclamation-circle text-danger display-4 mb-3 d-block"></i>
                    <h5 class="fw-bold mb-2">Delete Plan?</h5>
                    <p class="text-muted small mb-4">Are you sure you want to delete this membership plan?</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger px-3" id="confirm-delete-plan-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/plans.js"></script>
</body>
</html>
