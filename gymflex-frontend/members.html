<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlex - Member Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading d-flex align-items-center">
                <img src="assets/logo.svg" alt="GymFlex Logo" style="height: 32px; filter: brightness(0) invert(1);" class="me-2">
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="members.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-people me-2"></i>Members
                </a>
                <a href="plans.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-journal-bookmark me-2"></i>Plans
                </a>
                <a href="memberships.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-card-heading me-2"></i>Memberships
                </a>
                <a href="attendance.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-calendar-check me-2"></i>Attendance
                </a>
            </div>
            <div class="px-3 mt-auto mb-4">
                <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <div class="container-fluid p-0">
                    <span class="navbar-brand fw-bold text-dark">Member Management</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <div>
                        <h4 class="fw-bold mb-1">Gym Members</h4>
                        <p class="text-muted mb-0">View, register, and manage member profiles</p>
                    </div>
                    <button class="btn btn-primary shadow-sm" onclick="openAddMemberModal()" style="background-color: var(--primary-color); border: none;">
                        <i class="bi bi-person-plus-fill me-2"></i>Add Member
                    </button>
                </div>

                <!-- Filter & Search Bar -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 col-lg-4">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                    <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search members by name, email, or phone...">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 table-custom">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Join Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="members-table-body">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Member Modal (Add / Edit) -->
    <div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="modalTitle">Add New Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="member-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="member-id">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" required placeholder="e.g. Madhan Kumar">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" required placeholder="madhan@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" required placeholder="9876543210">
                        </div>

                        <div class="mb-3">
                            <label for="joinDate" class="form-label fw-semibold">Join Date</label>
                            <input type="date" class="form-control" id="joinDate" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-member-btn" style="background-color: var(--primary-color); border: none;">Save Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-exclamation-circle text-danger display-4 mb-3 d-block"></i>
                    <h5 class="fw-bold mb-2">Delete Member?</h5>
                    <p class="text-muted small mb-4">Are you sure you want to delete this member? This action cannot be undone.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger px-3" id="confirm-delete-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
