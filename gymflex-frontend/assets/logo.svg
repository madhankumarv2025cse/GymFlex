<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Dumbbell Icon -->
  <g transform="translate(10, 10)">
    <rect x="5" y="15" width="6" height="10" rx="2" fill="url(#grad)" />
    <rect x="11" y="10" width="6" height="20" rx="2" fill="url(#grad)" />
    <rect x="17" y="18" width="16" height="4" rx="1" fill="#94a3b8" />
    <rect x="33" y="10" width="6" height="20" rx="2" fill="url(#grad)" />
    <rect x="39" y="15" width="6" height="10" rx="2" fill="url(#grad)" />
  </g>
  <!-- Text -->
  <text x="65" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#0f172a" letter-spacing="1">GYM<tspan fill="#4f46e5">FLEX</tspan></text>
  <text x="66" y="46" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748b" letter-spacing="1.5">MEMBERSHIP &amp; ATTENDANCE</text>
</svg>
