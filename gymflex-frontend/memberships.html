<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlex - Membership Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading d-flex align-items-center">
                <img src="assets/logo.svg" alt="GymFlex Logo" style="height: 32px; filter: brightness(0) invert(1);" class="me-2">
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="members.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-2"></i>Members
                </a>
                <a href="plans.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-journal-bookmark me-2"></i>Plans
                </a>
                <a href="memberships.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-card-heading me-2"></i>Memberships
                </a>
                <a href="attendance.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-calendar-check me-2"></i>Attendance
                </a>
            </div>
            <div class="px-3 mt-auto mb-4">
                <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <div class="container-fluid p-0">
                    <span class="navbar-brand fw-bold text-dark">Membership Management</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <div>
                        <h4 class="fw-bold mb-1">Active & Expired Memberships</h4>
                        <p class="text-muted mb-0">Create new memberships and process plan renewals</p>
                    </div>
                    <button class="btn btn-primary shadow-sm" onclick="openCreateMembershipModal()" style="background-color: var(--primary-color); border: none;">
                        <i class="bi bi-card-checklist me-2"></i>Create Membership
                    </button>
                </div>

                <!-- Filter Controls -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body py-2">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm filter-btn active" onclick="filterMemberships('ALL')">All</button>
                            <button type="button" class="btn btn-outline-success btn-sm filter-btn" onclick="filterMemberships('ACTIVE')">Active</button>
                            <button type="button" class="btn btn-outline-danger btn-sm filter-btn" onclick="filterMemberships('EXPIRED')">Expired</button>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 table-custom">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Member Name</th>
                                        <th>Plan</th>
                                        <th>Start Date</th>
                                        <th>End Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="memberships-table-body">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Membership Modal -->
    <div class="modal fade" id="createMembershipModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Create New Membership</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="create-membership-form">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="memberSelect" class="form-label fw-semibold">Select Member</label>
                            <select class="form-select" id="memberSelect" required>
                                <option value="">Loading members...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="planSelect" class="form-label fw-semibold">Select Plan</label>
                            <select class="form-select" id="planSelect" required>
                                <option value="">Loading plans...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="startDate" class="form-label fw-semibold">Start Date</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="create-submit-btn" style="background-color: var(--primary-color); border: none;">Create Membership</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Renew Membership Modal -->
    <div class="modal fade" id="renewMembershipModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Renew Membership</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="renew-membership-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="renew-membership-id">

                        <div class="mb-3">
                            <label class="form-label text-muted small mb-1">Member Name</label>
                            <input type="text" class="form-control bg-light fw-bold" id="renew-member-name" readonly>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small mb-1">Current Plan</label>
                                <input type="text" class="form-control bg-light" id="renew-current-plan" readonly>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small mb-1">Current End Date</label>
                                <input type="text" class="form-control bg-light" id="renew-current-end" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="renewPlanSelect" class="form-label fw-semibold">Select Renewal Plan</label>
                            <select class="form-select" id="renewPlanSelect">
                                <option value="">-- Keep Current Plan or Select New --</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="renew-submit-btn" style="background-color: var(--primary-color); border: none;">Confirm Renewal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/memberships.js"></script>
</body>
</html>
