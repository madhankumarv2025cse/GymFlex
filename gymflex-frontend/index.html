<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlex - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card login-card bg-white p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img src="assets/logo.svg" alt="GymFlex Logo" class="img-fluid mb-3" style="max-height: 50px;">
                        <h4 class="fw-bold text-dark mb-1">Welcome Back!</h4>
                        <p class="text-muted small">Gym Membership & Attendance Tracker</p>
                    </div>

                    <div id="login-alert" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>Invalid email or password
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-start-0" id="email" value="admin@gymflex.com" required placeholder="admin@gymflex.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" value="admin123" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" style="background-color: var(--primary-color); border: none;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted">Demo Credentials: <strong>admin@gymflex.com</strong> / <strong>admin123</strong></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            checkAuth();

            const loginForm = document.getElementById("login-form");
            const loginAlert = document.getElementById("login-alert");

            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();

                if (email === "admin@gymflex.com" && password === "admin123") {
                    localStorage.setItem("gymflexLoggedIn", "true");
                    window.location.href = "dashboard.html";
                } else {
                    loginAlert.classList.remove("d-none");
                }
            });
        });
    </script>
</body>
</html>
