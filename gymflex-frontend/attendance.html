<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlex - Attendance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading d-flex align-items-center">
                <img src="assets/logo.svg" alt="GymFlex Logo" style="height: 32px; filter: brightness(0) invert(1);" class="me-2">
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="members.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-2"></i>Members
                </a>
                <a href="plans.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-journal-bookmark me-2"></i>Plans
                </a>
                <a href="memberships.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-card-heading me-2"></i>Memberships
                </a>
                <a href="attendance.html" class="list-group-item list-group-item-action active">
                    <i class="bi bi-calendar-check me-2"></i>Attendance
                </a>
            </div>
            <div class="px-3 mt-auto mb-4">
                <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <div class="container-fluid p-0">
                    <span class="navbar-brand fw-bold text-dark">Attendance Tracker</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="row g-4 mb-4">
                    <!-- Section 1: Check-in Box -->
                    <div class="col-12 col-lg-5">
                        <div class="card border-0 shadow-sm rounded-3 h-100 p-4">
                            <h4 class="fw-bold mb-1"><i class="bi bi-qr-code-scan text-primary me-2"></i>Member Check-in</h4>
                            <p class="text-muted small mb-4">Select member to log daily gym attendance</p>

                            <form id="checkin-form">
                                <div class="mb-4">
                                    <label for="checkinMemberSelect" class="form-label fw-semibold">Member</label>
                                    <select class="form-select form-select-lg" id="checkinMemberSelect" required>
                                        <option value="">Loading members...</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" id="checkin-btn" style="background-color: var(--primary-color); border: none;">
                                    <i class="bi bi-check2-circle me-2"></i>Record Check-In
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Section 2: Monthly Attendance Card Summary -->
                    <div class="col-12 col-lg-7">
                        <div class="card border-0 shadow-sm rounded-3 p-4 bg-primary text-white position-relative overflow-hidden h-100" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);">
                            <div class="position-relative z-1">
                                <small class="text-white-50 text-uppercase fw-bold letter-spacing">Current Month Attendance</small>
                                <h1 class="display-3 fw-extrabold my-2" id="monthly-count-display">0 Visits</h1>
                                <p class="mb-0 text-white-50" id="monthly-count-subtitle">Select a member to view records</p>
                            </div>
                            <i class="bi bi-calendar-event position-absolute end-0 bottom-0 display-1 text-white opacity-10 m-3"></i>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Attendance History -->
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center border-0 gap-3">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-clock-history me-2 text-info"></i>Attendance History</h5>
                        <div style="min-width: 280px;">
                            <select class="form-select form-select-sm" id="historyMemberSelect">
                                <option value="">Loading members...</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 table-custom">
                                <thead>
                                    <tr>
                                        <th>Check-in ID</th>
                                        <th>Member Name</th>
                                        <th>Check-in Date</th>
                                    </tr>
                                </thead>
                                <tbody id="attendance-table-body">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
